name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libglib2.0-dev libgtk-4-dev libwayland-dev libx11-dev \
            libcairo2-dev libpango1.0-dev gettext nodejs \
            desktop-file-utils appstream imagemagick rpm

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make check
